<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hackathon Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a0a1a 100%);
    font-family: 'Rajdhani', sans-serif;
    color: #fff;
    overflow: hidden;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    width: 100%;
    max-width: 480px;
    padding: 20px;
  }

  .title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 900;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #00ff88, #00cc66);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 48px;
  }

  .cards {
    display: flex;
    gap: 16px;
    justify-content: center;
  }

  .card {
    flex: 1;
    max-width: 200px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 32px 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .card:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.2);
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }

  .card-icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-icon svg {
    width: 32px;
    height: 32px;
  }

  .card-display .card-icon {
    background: rgba(0,255,136,0.1);
    border: 1px solid rgba(0,255,136,0.2);
  }
  .card-display .card-icon svg { stroke: #00ff88; }
  .card-display:hover {
    border-color: rgba(0,255,136,0.3);
    box-shadow: 0 12px 40px rgba(0,255,136,0.1);
  }

  .card-panel .card-icon {
    background: rgba(100,140,255,0.1);
    border: 1px solid rgba(100,140,255,0.2);
  }
  .card-panel .card-icon svg { stroke: #648cff; }
  .card-panel:hover {
    border-color: rgba(100,140,255,0.3);
    box-shadow: 0 12px 40px rgba(100,140,255,0.1);
  }

  .card-title {
    font-family: 'Orbitron', monospace;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.1em;
  }

  .card-desc {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    line-height: 1.4;
  }

  /* === PASSWORD OVERLAY === */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(10px);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .overlay.visible {
    display: flex;
  }

  .password-box {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 340px;
    text-align: center;
  }

  .password-box h2 {
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
    color: #648cff;
  }

  .password-box p {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 24px;
  }

  .password-input {
    width: 100%;
    padding: 14px 18px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-align: center;
    outline: none;
    transition: border-color 0.3s;
  }
  .password-input:focus {
    border-color: #648cff;
    box-shadow: 0 0 20px rgba(100,140,255,0.15);
  }
  .password-input.error {
    border-color: #ff4444;
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  .password-btn {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    background: linear-gradient(135deg, #648cff, #4466dd);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.3s;
  }
  .password-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(100,140,255,0.3);
  }

  .error-msg {
    color: #ff4444;
    font-size: 13px;
    margin-top: 12px;
    min-height: 20px;
  }

  .close-btn {
    position: absolute;
    top: 16px;
    right: 20px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    font-size: 28px;
    cursor: pointer;
    transition: color 0.2s;
  }
  .close-btn:hover { color: #fff; }

  .ban-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0,0,0,0.95);
    align-items: center;
    justify-content: center;
  }
  .ban-overlay.visible {
    display: flex;
  }
  .ban-overlay img {
    max-width: 80vw;
    max-height: 80vh;
    object-fit: contain;
  }
</style>
</head>
<body>

<div class="bg-grid"></div>

  <div class="cards">
    <a class="card card-display" href="#" onclick="goDisplay(); return false;">
      <div class="card-title">DISPLAY</div>
    </a>

    <a class="card card-panel" href="#" onclick="showPasswordPrompt(); return false;">
      <div class="card-title">PANEL</div>
    </a>
  </div>
</div>

<!-- PASSWORD OVERLAY -->
<div class="overlay" id="passwordOverlay">
  <button class="close-btn" onclick="closePassword()">&times;</button>
  <div class="password-box">
    <input type="password" class="password-input" id="passwordInput" placeholder="Haslo..." autofocus>
    <button class="password-btn" onclick="checkPassword()">WEJDZ</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<div class="ban-overlay" id="banOverlay">
  <img src="/ban.png" alt="BANNED">
</div>

<script>
  function goDisplay() {
    window.location.href = '/display.html';
  }

  function showPasswordPrompt() {
    document.getElementById('passwordOverlay').classList.add('visible');
    document.getElementById('passwordInput').value = '';
    document.getElementById('errorMsg').textContent = '';
    document.getElementById('passwordInput').classList.remove('error');
    setTimeout(() => document.getElementById('passwordInput').focus(), 100);
  }

  function closePassword() {
    document.getElementById('passwordOverlay').classList.remove('visible');
  }

  function checkPassword() {
    const input = document.getElementById('passwordInput');
    const error = document.getElementById('errorMsg');
    const btn = document.querySelector('.password-btn');
    btn.disabled = true;
    btn.textContent = '...';

    fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: input.value }),
    })
    .then(r => r.json().then(data => ({ ok: r.ok, data })))
    .then(({ ok, data }) => {
      if (ok && data.ok) {
        window.location.href = '/remote.html';
      } else {
        input.classList.add('error');
        error.textContent = 'Bledne haslo';
        setTimeout(() => input.classList.remove('error'), 400);
        input.value = '';
        btn.disabled = false;
        btn.textContent = 'WEJDZ';
        document.getElementById('banOverlay').classList.add('visible');
        setTimeout(() => {
          document.getElementById('banOverlay').classList.remove('visible');
          input.focus();
        }, 2000);
      }
    })
    .catch(() => {
      error.textContent = 'Blad polaczenia';
      btn.disabled = false;
      btn.textContent = 'WEJDZ';
    });
  }

  // Enter key support
  document.getElementById('passwordInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkPassword();
    if (e.key === 'Escape') closePassword();
  });

  // Close overlay on backdrop click
  document.getElementById('passwordOverlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('passwordOverlay')) closePassword();
  });
</script>
</body>
</html>
