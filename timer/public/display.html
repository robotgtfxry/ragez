<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hackathon Timer - Ekran</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 1s ease;
    cursor: none;
    margin: 0;
    padding: 0;
  }

  /* === BACKGROUNDS === */
  .bg-dark-gradient { background: linear-gradient(135deg, #0a0a2e 0%, #1a0a3e 50%, #0a1a3e 100%); }
  .bg-cyber-purple { background: linear-gradient(135deg, #1a002e 0%, #3d0066 30%, #1a0044 60%, #0d0022 100%); }
  .bg-ocean-deep { background: linear-gradient(135deg, #001122 0%, #003355 40%, #001a33 70%, #000d1a 100%); }
  .bg-fire { background: linear-gradient(135deg, #1a0000 0%, #4d0000 30%, #330000 60%, #1a0500 100%); }
  .bg-matrix { background: linear-gradient(180deg, #000a00 0%, #001a00 50%, #000800 100%); }
  .bg-sunset { background: linear-gradient(135deg, #1a0022 0%, #4d0033 25%, #661a00 50%, #332200 75%, #1a1100 100%); }
  .bg-arctic { background: linear-gradient(135deg, #0a1628 0%, #162d50 30%, #0a2040 60%, #051020 100%); }
  .bg-neon-city { background: linear-gradient(135deg, #0d001a 0%, #1a0033 25%, #000d1a 50%, #001a0d 75%, #0d001a 100%); }
  .bg-midnight { background: linear-gradient(135deg, #000000 0%, #0d0d1a 30%, #1a1a2e 50%, #0d0d1a 70%, #000000 100%); }
  .bg-volcano { background: linear-gradient(135deg, #1a0500 0%, #330a00 25%, #4d1a00 50%, #1a0a00 75%, #0d0500 100%); }
  .bg-aurora { background: linear-gradient(135deg, #001a0d 0%, #003322 25%, #001a33 50%, #0d0033 75%, #1a0033 100%); }
  .bg-galaxy { background: linear-gradient(135deg, #0a001a 0%, #1a0033 20%, #000d1a 40%, #001a33 60%, #0d001a 80%, #1a000d 100%); }
  .bg-custom { background: linear-gradient(135deg, var(--custom-bg1), var(--custom-bg2)); }

  /* === PARTICLES === */
  .particles {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    animation: float linear infinite;
  }
  @keyframes float {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* === TIMER === */
  .timer-container {
    position: relative;
    z-index: 10;
    text-align: center;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .timer-display {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: clamp(80px, 18vw, 280px);
    letter-spacing: 0.05em;
    transition: color 0.5s ease, text-shadow 0.5s ease;
    line-height: 1;
  }

  /* === GLOW STYLES === */
  .glow-none .timer-display {
    text-shadow: none;
  }
  .glow-soft .timer-display {
    text-shadow:
      0 0 10px currentColor,
      0 0 20px rgba(255,255,255,0.1);
  }
  .glow-neon .timer-display {
    text-shadow:
      0 0 10px currentColor,
      0 0 30px currentColor,
      0 0 60px currentColor,
      0 0 120px currentColor;
  }
  .glow-pulse .timer-display {
    text-shadow:
      0 0 20px currentColor,
      0 0 40px currentColor,
      0 0 80px currentColor;
    animation: glowPulse 2s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% {
      text-shadow:
        0 0 10px currentColor,
        0 0 20px currentColor,
        0 0 40px currentColor;
    }
    50% {
      text-shadow:
        0 0 20px currentColor,
        0 0 60px currentColor,
        0 0 120px currentColor,
        0 0 200px currentColor;
    }
  }
  .glow-custom .timer-display {
    text-shadow:
      0 0 10px var(--glow-color1, currentColor),
      0 0 30px var(--glow-color1, currentColor),
      0 0 60px var(--glow-color2, currentColor),
      0 0 100px var(--glow-color2, currentColor);
  }

  .timer-label {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(16px, 3vw, 36px);
    font-weight: 300;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.6;
    margin-top: 10px;
    color: #ffffff;
  }

  /* === TIMER BAR === */
  .timer-bar-container {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 8px;
    background: rgba(255,255,255,0.1);
    z-index: 20;
  }
  .timer-bar {
    height: 100%;
    transition: width 0.5s linear, background-color 0.5s ease;
    box-shadow: 0 0 15px currentColor;
  }

  /* === WARNING EFFECTS === */
  .warning-pulse {
    animation: warningPulse 1s ease-in-out infinite;
  }
  @keyframes warningPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .danger-flash {
    animation: dangerFlash 0.5s ease-in-out infinite;
  }
  @keyframes dangerFlash {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.02); }
  }

  .warning-label {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Orbitron', monospace;
    font-size: clamp(14px, 2.5vw, 28px);
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding: 10px 40px;
    border-radius: 50px;
    border: 2px solid;
    z-index: 30;
    animation: warningBlink 1s ease infinite;
    display: none;
  }
  @keyframes warningBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* === FINISH SCREEN === */
  .finish-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 100;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000000;
    animation: finishFadeIn 0.5s ease;
  }
  .finish-overlay.active { display: flex; }
  @keyframes finishFadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  .finish-message {
    font-family: 'Orbitron', monospace;
    font-size: clamp(40px, 10vw, 120px);
    font-weight: 900;
    color: #ffffff;
    text-shadow: none;
    text-align: center;
    padding: 0 20px;
    transition: opacity 0.5s ease;
  }
  .finish-message.hidden { opacity: 0; pointer-events: none; }
  .finish-image {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    object-fit: contain;
    border-radius: 0;
    box-shadow: none;
    display: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .finish-image.active {
    display: block;
    opacity: 1;
  }

  /* === ANNOUNCEMENT === */
  .announcement-bar {
    position: fixed;
    left: 0; right: 0;
    z-index: 50;
    display: none;
    padding: 20px 40px;
    text-align: center;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    animation: announcementSlide 0.5s ease;
  }
  .announcement-bar.pos-top { top: 0; }
  .announcement-bar.pos-center {
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 20px;
    max-width: 80%;
    right: auto;
  }
  .announcement-bar.pos-bottom { bottom: 60px; }
  .announcement-bar.active { display: block; }
  @keyframes announcementSlide {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .announcement-bar.pos-center.active {
    animation: announcementPop 0.5s ease;
  }
  @keyframes announcementPop {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  /* === OVERLAY IMAGE === */
  .overlay-image {
    position: fixed;
    z-index: 15;
    display: none;
    object-fit: contain;
    filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
  }
  .overlay-image.active { display: block; }
  .overlay-image.pos-top-left { top: 20px; left: 20px; }
  .overlay-image.pos-top-right { top: 20px; right: 20px; }
  .overlay-image.pos-bottom-left { bottom: 20px; left: 20px; }
  .overlay-image.pos-bottom-right { bottom: 20px; right: 20px; }
  .overlay-image.pos-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }

  /* === TIMER STYLE SWITCHING === */
  .style-cyber, .style-ring, .style-classic, .style-minimal, .style-flip {
    display: none;
    width: 100%;
  }
  .style-active { display: flex !important; flex-direction: column; align-items: center; justify-content: center; }

  /* === RING STYLE === */
  .ring-wrapper {
    position: relative;
    width: clamp(280px, 50vw, 550px);
    height: clamp(280px, 50vw, 550px);
    margin: 0 auto;
  }
  .ring-svg {
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }
  .ring-bg {
    fill: none;
    stroke: rgba(255,255,255,0.06);
    stroke-width: 12;
  }
  .ring-progress {
    fill: none;
    stroke: url(#ringGrad);
    stroke-width: 14;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s ease;
    filter: drop-shadow(0 0 12px rgba(0,255,136,0.5));
  }
  .ring-ticks line {
    stroke: rgba(255,255,255,0.15);
    stroke-width: 1;
  }
  .ring-ticks line.major {
    stroke: rgba(255,255,255,0.35);
    stroke-width: 2;
  }
  .ring-inner {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .ring-time {
    font-family: 'Orbitron', monospace;
    font-size: clamp(36px, 8vw, 80px);
    font-weight: 900;
    letter-spacing: 0.05em;
    transition: color 0.5s;
  }
  .ring-label {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(12px, 2vw, 22px);
    font-weight: 300;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.5;
    margin-top: 5px;
  }

  /* === CLASSIC STYLE === */
  .classic-cards {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(12px, 3vw, 30px);
  }
  .classic-card {
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: clamp(12px, 2vw, 24px);
    padding: clamp(16px, 3vw, 40px) clamp(20px, 4vw, 50px);
    text-align: center;
    min-width: clamp(80px, 15vw, 180px);
    transition: border-color 0.5s, box-shadow 0.5s;
  }
  .classic-digit {
    display: block;
    font-family: 'Orbitron', monospace;
    font-size: clamp(50px, 12vw, 140px);
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(180deg, #fff, rgba(255,255,255,0.6));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    transition: all 0.5s;
  }
  .classic-unit {
    display: block;
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(10px, 1.5vw, 16px);
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.3);
    margin-top: 8px;
    text-transform: uppercase;
  }
  .classic-sep {
    font-size: clamp(40px, 10vw, 120px);
    font-weight: 300;
    color: rgba(255,255,255,0.15);
    padding-bottom: clamp(20px, 4vw, 50px);
    animation: blink 1s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.2; } }
  .classic-label {
    text-align: center;
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(14px, 2.5vw, 28px);
    font-weight: 300;
    letter-spacing: 0.3em;
    opacity: 0.5;
    margin-top: clamp(16px, 3vw, 30px);
    text-transform: uppercase;
  }

  /* === MINIMAL STYLE === */
  .style-minimal.style-active { width: 80vw; max-width: 900px; }
  .minimal-time {
    font-family: 'Space Mono', monospace;
    font-size: clamp(60px, 15vw, 200px);
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.1em;
    color: #fff;
    transition: color 0.5s;
  }
  .minimal-bar-container {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    margin-top: clamp(10px, 2vw, 25px);
    overflow: hidden;
  }
  .minimal-bar {
    height: 100%;
    width: 100%;
    border-radius: 4px;
    background: #00ff88;
    transition: width 0.5s linear, background-color 0.5s;
    box-shadow: 0 0 10px currentColor;
  }
  .minimal-label {
    text-align: center;
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(12px, 2vw, 22px);
    font-weight: 300;
    letter-spacing: 0.3em;
    opacity: 0.4;
    margin-top: clamp(8px, 1.5vw, 18px);
    text-transform: uppercase;
  }

  /* === FLIP STYLE === */
  .flip-cards {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(8px, 2vw, 20px);
  }
  .flip-group {
    display: flex;
    gap: clamp(3px, 0.5vw, 6px);
    position: relative;
  }
  .flip-card {
    background: linear-gradient(180deg, #2a2a3e 0%, #1a1a2e 49.9%, #151525 50.1%, #1a1a2e 100%);
    border-radius: clamp(6px, 1vw, 14px);
    padding: clamp(10px, 2vw, 25px) clamp(8px, 1.5vw, 20px);
    min-width: clamp(40px, 8vw, 90px);
    text-align: center;
    box-shadow:
      0 4px 15px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.05),
      inset 0 -1px 0 rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
  }
  .flip-card::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    height: 1px;
    background: rgba(0,0,0,0.4);
    box-shadow: 0 1px 0 rgba(255,255,255,0.03);
  }
  .flip-digit {
    font-family: 'Orbitron', monospace;
    font-size: clamp(40px, 10vw, 110px);
    font-weight: 900;
    color: #fff;
    line-height: 1;
    transition: color 0.5s;
  }
  .flip-sep {
    font-family: 'Orbitron', monospace;
    font-size: clamp(30px, 8vw, 90px);
    font-weight: 300;
    color: rgba(255,255,255,0.2);
    padding-bottom: clamp(15px, 3vw, 40px);
    animation: blink 1s ease-in-out infinite;
  }
  .flip-unit {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(8px, 1.2vw, 14px);
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.25);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .flip-label {
    text-align: center;
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(14px, 2.5vw, 28px);
    font-weight: 300;
    letter-spacing: 0.3em;
    opacity: 0.5;
    margin-top: clamp(30px, 5vw, 50px);
    text-transform: uppercase;
  }

  /* === SCREEN FLASH FOR SOUNDS === */
  .screen-flash {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 200;
    opacity: 0;
  }
</style>
</head>
<body class="bg-dark-gradient">

<div class="particles" id="particles"></div>

<div class="timer-container" id="timerContainer">
  <!-- CYBER style (default) -->
  <div class="style-cyber style-active" id="styleCyber">
    <div class="timer-display" id="timerDisplay">00:00:00</div>
    <div class="timer-label" id="timerLabel">HACKATHON TIMER</div>
  </div>

  <!-- RING style - circular countdown -->
  <div class="style-ring" id="styleRing">
    <div class="ring-wrapper">
      <svg class="ring-svg" viewBox="0 0 400 400">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" id="ringGradStop1" stop-color="#00ff88"/>
            <stop offset="100%" id="ringGradStop2" stop-color="#00cc66"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="200" cy="200" r="175" />
        <circle class="ring-progress" id="ringProgress" cx="200" cy="200" r="175"
          stroke-dasharray="1099.56" stroke-dashoffset="0" />
        <!-- tick marks -->
        <g class="ring-ticks" id="ringTicks"></g>
      </svg>
      <div class="ring-inner">
        <div class="ring-time" id="ringTime">00:00:00</div>
        <div class="ring-label" id="ringLabel">HACKATHON TIMER</div>
      </div>
    </div>
  </div>

  <!-- CLASSIC style - elegant cards -->
  <div class="style-classic" id="styleClassic">
    <div class="classic-cards">
      <div class="classic-card">
        <span class="classic-digit" id="classicHours">00</span>
        <span class="classic-unit">GODZIN</span>
      </div>
      <div class="classic-sep">:</div>
      <div class="classic-card">
        <span class="classic-digit" id="classicMinutes">00</span>
        <span class="classic-unit">MINUT</span>
      </div>
      <div class="classic-sep">:</div>
      <div class="classic-card">
        <span class="classic-digit" id="classicSeconds">00</span>
        <span class="classic-unit">SEKUND</span>
      </div>
    </div>
    <div class="classic-label" id="classicLabel">HACKATHON TIMER</div>
  </div>

  <!-- MINIMAL style - clean thin -->
  <div class="style-minimal" id="styleMinimal">
    <div class="minimal-time" id="minimalTime">00:00:00</div>
    <div class="minimal-bar-container">
      <div class="minimal-bar" id="minimalBar"></div>
    </div>
    <div class="minimal-label" id="minimalLabel">HACKATHON TIMER</div>
  </div>

  <!-- FLIP style - retro flip clock -->
  <div class="style-flip" id="styleFlip">
    <div class="flip-cards">
      <div class="flip-group">
        <div class="flip-card"><span class="flip-digit" id="flipH1">0</span></div>
        <div class="flip-card"><span class="flip-digit" id="flipH2">0</span></div>
        <span class="flip-unit">GODZ</span>
      </div>
      <div class="flip-sep">:</div>
      <div class="flip-group">
        <div class="flip-card"><span class="flip-digit" id="flipM1">0</span></div>
        <div class="flip-card"><span class="flip-digit" id="flipM2">0</span></div>
        <span class="flip-unit">MIN</span>
      </div>
      <div class="flip-sep">:</div>
      <div class="flip-group">
        <div class="flip-card"><span class="flip-digit" id="flipS1">0</span></div>
        <div class="flip-card"><span class="flip-digit" id="flipS2">0</span></div>
        <span class="flip-unit">SEK</span>
      </div>
    </div>
    <div class="flip-label" id="flipLabel">HACKATHON TIMER</div>
  </div>
</div>

<div class="timer-bar-container">
  <div class="timer-bar" id="timerBar" style="width:100%"></div>
</div>

<div class="warning-label" id="warningLabel">⚠ CZAS SIĘ KOŃCZY ⚠</div>

<div class="finish-overlay" id="finishOverlay">
  <div class="finish-message" id="finishMessage">⏰ CZAS MINĄŁ!</div>
  <img class="finish-image" id="finishImage" src="" alt="">
</div>

<div class="announcement-bar" id="announcementBar"></div>

<img class="overlay-image" id="overlayImage" src="" alt="">

<div class="screen-flash" id="screenFlash"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  socket.emit('register', 'display');

  let currentState = {};
  let announcementTimeout = null;
  let warningPlayed = false;
  let dangerPlayed = false;
  let finishPlayed = false;
  let finishImageTimeout = null;
  let finishPhase = 0; // 0=not finished, 1=showing message, 2=showing image

  // Audio context for sounds
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function getAudioCtx() {
    if (!audioCtx) audioCtx = new AudioCtx();
    return audioCtx;
  }

  function playBeep(freq, duration, type = 'sine', volume = 0.3) {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(volume, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }

  function playWarningSound() {
    playBeep(800, 0.3, 'square', 0.2);
    setTimeout(() => playBeep(600, 0.3, 'square', 0.2), 350);
    setTimeout(() => playBeep(800, 0.3, 'square', 0.2), 700);
  }

  function playFinishSound() {
    const freqs = [523, 659, 784, 1047, 784, 659, 523];
    freqs.forEach((f, i) => {
      setTimeout(() => playBeep(f, 0.4, 'square', 0.3), i * 200);
    });
    // Also a big alarm
    setTimeout(() => {
      for (let i = 0; i < 6; i++) {
        setTimeout(() => playBeep(880, 0.15, 'sawtooth', 0.4), i * 250);
        setTimeout(() => playBeep(440, 0.15, 'sawtooth', 0.4), i * 250 + 125);
      }
    }, 1500);
  }

  function playTickSound() {
    playBeep(1200, 0.05, 'sine', 0.1);
  }

  // Create particles
  // Generate ring tick marks
  (function() {
    const ticks = document.getElementById('ringTicks');
    for (let i = 0; i < 60; i++) {
      const angle = (i * 6) * Math.PI / 180;
      const isMajor = i % 5 === 0;
      const r1 = isMajor ? 155 : 160;
      const r2 = 168;
      const x1 = 200 + r1 * Math.cos(angle);
      const y1 = 200 + r1 * Math.sin(angle);
      const x2 = 200 + r2 * Math.cos(angle);
      const y2 = 200 + r2 * Math.sin(angle);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      if (isMajor) line.classList.add('major');
      ticks.appendChild(line);
    }
  })();

  const RING_CIRCUMFERENCE = 2 * Math.PI * 175; // ~1099.56

  function switchTimerStyle(style) {
    ['styleCyber','styleRing','styleClassic','styleMinimal','styleFlip'].forEach(id => {
      document.getElementById(id).classList.remove('style-active');
    });
    const map = { cyber:'styleCyber', ring:'styleRing', classic:'styleClassic', minimal:'styleMinimal', flip:'styleFlip' };
    const el = document.getElementById(map[style] || 'styleCyber');
    if (el) el.classList.add('style-active');
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function updateAllTimerStyles(timeStr, h, m, s, progress, color) {
    // Cyber
    document.getElementById('timerDisplay').textContent = timeStr;
    document.getElementById('timerDisplay').style.color = color;

    // Ring
    document.getElementById('ringTime').textContent = timeStr;
    document.getElementById('ringTime').style.color = color;
    const ringOffset = RING_CIRCUMFERENCE * (1 - progress);
    document.getElementById('ringProgress').style.strokeDashoffset = ringOffset;
    document.getElementById('ringGradStop1').setAttribute('stop-color', color);
    document.getElementById('ringGradStop2').setAttribute('stop-color', color);
    document.getElementById('ringProgress').style.filter = `drop-shadow(0 0 12px ${color})`;

    // Classic
    document.getElementById('classicHours').textContent = pad(h);
    document.getElementById('classicMinutes').textContent = pad(m);
    document.getElementById('classicSeconds').textContent = pad(s);
    document.querySelectorAll('.classic-digit').forEach(el => {
      el.style.background = `linear-gradient(180deg, ${color}, ${color}99)`;
      el.style.webkitBackgroundClip = 'text';
      el.style.webkitTextFillColor = 'transparent';
    });
    document.querySelectorAll('.classic-card').forEach(el => {
      el.style.borderColor = color + '20';
      el.style.boxShadow = `0 0 30px ${color}10`;
    });

    // Minimal
    document.getElementById('minimalTime').textContent = timeStr;
    document.getElementById('minimalTime').style.color = color;
    document.getElementById('minimalBar').style.width = (progress * 100) + '%';
    document.getElementById('minimalBar').style.backgroundColor = color;

    // Flip
    const hStr = pad(h), mStr = pad(m), sStr = pad(s);
    document.getElementById('flipH1').textContent = hStr[0];
    document.getElementById('flipH2').textContent = hStr[1];
    document.getElementById('flipM1').textContent = mStr[0];
    document.getElementById('flipM2').textContent = mStr[1];
    document.getElementById('flipS1').textContent = sStr[0];
    document.getElementById('flipS2').textContent = sStr[1];
    document.querySelectorAll('.flip-digit').forEach(el => el.style.color = color);
  }

  function setAllLabels(text) {
    ['timerLabel','ringLabel','classicLabel','minimalLabel','flipLabel'].forEach(id => {
      document.getElementById(id).textContent = text;
    });
  }

  function createParticles() {
    const container = document.getElementById('particles');
    container.innerHTML = '';
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 4 + 1;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 15 + 10) + 's';
      p.style.animationDelay = (Math.random() * 15) + 's';
      container.appendChild(p);
    }
  }
  createParticles();

  function formatTime(ms) {
    if (ms <= 0) return '00:00:00';
    const totalSec = Math.ceil(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if (h > 0) {
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function updateDisplay() {
    const st = currentState;
    const display = document.getElementById('timerDisplay');
    const bar = document.getElementById('timerBar');
    const warning = document.getElementById('warningLabel');
    const finish = document.getElementById('finishOverlay');
    const finishMsg = document.getElementById('finishMessage');
    const finishImg = document.getElementById('finishImage');

    // Background + Glow
    const glowClass = 'glow-' + (st.timerGlowStyle || 'neon');
    document.body.className = (st.background || 'bg-dark-gradient') + ' ' + glowClass;
    if (st.background === 'bg-custom') {
      document.body.style.setProperty('--custom-bg1', st.customBgColor1);
      document.body.style.setProperty('--custom-bg2', st.customBgColor2);
    }

    // Custom glow colors
    if (st.timerGlowStyle === 'custom') {
      document.body.style.setProperty('--glow-color1', st.glowColor1 || '#00ff88');
      document.body.style.setProperty('--glow-color2', st.glowColor2 || '#0088ff');
    }

    // Timer display style
    switchTimerStyle(st.timerDisplayStyle || 'cyber');

    // Overlay image
    const oi = document.getElementById('overlayImage');
    if (st.overlayImage) {
      oi.src = st.overlayImage;
      oi.style.width = (st.overlaySize || 150) + 'px';
      oi.className = 'overlay-image active pos-' + (st.overlayPosition || 'top-right');
    } else {
      oi.className = 'overlay-image';
    }

    // Timer finished
    if (st.timerFinished) {
      finish.classList.add('active');

      if (!finishPlayed) {
        // Phase 1: show message on black screen
        finishPhase = 1;
        finishMsg.textContent = st.finishMessage || '⏰ CZAS MINĄŁ!';
        finishMsg.classList.remove('hidden');
        finishImg.classList.remove('active');

        if (st.soundEnabled && st.finishSound) {
          playFinishSound();
        }
        finishPlayed = true;

        // After 5 seconds, transition to fullscreen image if available
        if (finishImageTimeout) clearTimeout(finishImageTimeout);
        if (st.finishImage) {
          finishImageTimeout = setTimeout(() => {
            finishPhase = 2;
            finishMsg.classList.add('hidden');
            finishImg.src = st.finishImage;
            finishImg.classList.add('active');
          }, 5000);
        }
      }
      return;
    } else {
      finish.classList.remove('active');
      finishMsg.classList.remove('hidden');
      finishImg.classList.remove('active');
      if (finishImageTimeout) { clearTimeout(finishImageTimeout); finishImageTimeout = null; }
      finishPhase = 0;
    }

    if (!st.timerRunning) {
      const defaultColor = st.timerColor || '#00ff88';
      display.className = 'timer-display';
      warning.style.display = 'none';
      if (!st.timerEndTime) {
        updateAllTimerStyles('00:00:00', 0, 0, 0, 1, defaultColor);
        bar.style.width = '100%';
        bar.style.backgroundColor = defaultColor;
      }
      setAllLabels(st.timerPaused ? '⏸ PAUZA' : (st.timerLabel || ''));
      finishPlayed = false;
      warningPlayed = false;
      dangerPlayed = false;
      return;
    }

    let remaining;
    if (st.timerPaused) {
      remaining = st.timerPausedRemaining;
    } else {
      remaining = new Date(st.timerEndTime) - Date.now();
    }

    if (remaining <= 0) {
      remaining = 0;
      updateAllTimerStyles('00:00:00', 0, 0, 0, 0, st.timerDangerColor || '#ff0040');
      bar.style.width = '0%';
      socket.emit('timer-finished');
      return;
    }

    const totalSec = remaining / 1000;
    const progressRatio = st.timerDuration > 0 ? (remaining / st.timerDuration) : 1;
    const progressPct = progressRatio * 100;

    // Parsed time
    const ceilSec = Math.ceil(totalSec);
    const h = Math.floor(ceilSec / 3600);
    const m = Math.floor((ceilSec % 3600) / 60);
    const s = ceilSec % 60;
    const timeStr = formatTime(remaining);

    // Color based on time remaining
    let color = st.timerColor || '#00ff88';
    if (totalSec <= (st.dangerThreshold || 60)) {
      color = st.timerDangerColor || '#ff0040';
      display.className = 'timer-display danger-flash';
      warning.style.display = 'block';
      warning.textContent = '🚨 OSTATNIE SEKUNDY! 🚨';
      warning.style.color = color;
      warning.style.borderColor = color;
      warning.style.background = 'rgba(255,0,0,0.15)';
      if (!dangerPlayed && st.soundEnabled && st.warningSound) {
        playWarningSound();
        dangerPlayed = true;
      }
      if (totalSec <= 10 && st.soundEnabled && st.tickSound) {
        playTickSound();
      }
    } else if (totalSec <= (st.warningThreshold || 300)) {
      color = st.timerWarningColor || '#ff6b35';
      display.className = 'timer-display warning-pulse';
      warning.style.display = 'block';
      warning.textContent = '⚠ CZAS SIĘ KOŃCZY ⚠';
      warning.style.color = color;
      warning.style.borderColor = color;
      warning.style.background = 'rgba(255,107,53,0.1)';
      if (!warningPlayed && st.soundEnabled && st.warningSound) {
        playWarningSound();
        warningPlayed = true;
      }
    } else {
      display.className = 'timer-display';
      warning.style.display = 'none';
    }

    // Update ALL timer styles
    updateAllTimerStyles(timeStr, h, m, s, progressRatio, color);
    bar.style.width = progressPct + '%';
    bar.style.backgroundColor = color;

    setAllLabels(st.timerPaused ? '⏸ PAUZA' : 'HACKATHON TIMER');
  }

  function updateAnnouncement() {
    const bar = document.getElementById('announcementBar');
    const st = currentState;

    if (st.announcement) {
      bar.textContent = st.announcement.text;
      bar.style.color = st.announcement.textColor || '#fff';
      bar.style.backgroundColor = st.announcement.bgColor || 'rgba(0,0,0,0.85)';
      bar.style.fontSize = (st.announcement.fontSize || 48) + 'px';
      bar.className = 'announcement-bar active pos-' + (st.announcement.position || 'bottom');

      if (announcementTimeout) clearTimeout(announcementTimeout);
      if (st.announcement.duration > 0) {
        announcementTimeout = setTimeout(() => {
          bar.classList.remove('active');
        }, st.announcement.duration * 1000);
      }
    } else {
      bar.classList.remove('active');
    }
  }

  let lastAnnouncementId = null;
  socket.on('state-sync', (state) => {
    currentState = state;
    updateDisplay();

    if (state.announcement && state.announcement.id !== lastAnnouncementId) {
      lastAnnouncementId = state.announcement ? state.announcement.id : null;
      updateAnnouncement();
    } else if (!state.announcement) {
      lastAnnouncementId = null;
      updateAnnouncement();
    }
  });

  // Update every 100ms for smooth countdown
  setInterval(updateDisplay, 100);

  // Init audio on first interaction
  document.addEventListener('click', () => {
    getAudioCtx();
  }, { once: true });
</script>
</body>
