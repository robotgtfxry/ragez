<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon Timer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            color: #fff;
            overflow: hidden;
            transition: background 0.8s ease;
        }

        /* ===== THEME BACKGROUNDS ===== */
        body.theme-cosmic {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }
        body.theme-sunset {
            background: linear-gradient(135deg, #1a0a2e, #6b2fa0, #d63384, #ff6a00);
        }
        body.theme-ocean {
            background: linear-gradient(135deg, #001d3d, #003566, #006d77, #0db39e);
        }
        body.theme-forest {
            background: linear-gradient(135deg, #0b1a0f, #1b4332, #2d6a4f, #40916c);
        }
        body.theme-fire {
            background: linear-gradient(135deg, #1a0000, #5c0a0a, #b91c1c, #f59e0b);
        }
        body.theme-neon {
            background: linear-gradient(135deg, #0a0a0a, #1a002e, #0a0a2e, #0a0a0a);
        }
        body.theme-arctic {
            background: linear-gradient(135deg, #0c1445, #1e3a5f, #4a90d9, #a0d2db);
        }
        body.theme-midnight {
            background: linear-gradient(135deg, #020024, #090979, #00d4ff);
        }
        body.theme-cherry {
            background: linear-gradient(135deg, #1a0011, #4a0028, #8b1a4a, #c2185b);
        }
        body.theme-matrix {
            background: linear-gradient(135deg, #000000, #001a00, #003300, #000000);
        }

        /* neon special glow effects */
        body.theme-neon .time-card { border-color: rgba(0, 255, 136, 0.3); box-shadow: 0 0 30px rgba(0, 255, 136, 0.1); }
        body.theme-neon .time-card .digits { -webkit-text-fill-color: #00ff88; text-shadow: 0 0 20px rgba(0,255,136,0.5); }
        body.theme-matrix .time-card .digits { -webkit-text-fill-color: #00ff41; text-shadow: 0 0 20px rgba(0,255,65,0.5); font-family: 'JetBrains Mono', monospace; }

        /* particles */
        .bg-particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            animation: float linear infinite;
        }
        @keyframes float {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* layout */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 900px;
            width: 100%;
        }

        /* event name */
        .event-name {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            margin-bottom: 0.3rem;
            min-height: 1.5em;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
            background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.35);
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
        }

        /* mode tabs */
        .mode-tabs {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .mode-tab {
            padding: 0.5rem 1.5rem;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50px;
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.5);
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-tab.active {
            background: rgba(167, 139, 250, 0.2);
            border-color: rgba(167, 139, 250, 0.4);
            color: #a78bfa;
        }

        .mode-tab:hover { border-color: rgba(255,255,255,0.3); color: #fff; }

        /* setup panels */
        .setup-panel { display: none; margin-bottom: 1.5rem; }
        .setup-panel.active { display: block; }

        .setup-row {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }

        .input-group label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.35);
        }

        .input-group input, .input-group select {
            width: 80px;
            padding: 0.6rem;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.2);
        }

        .input-group select { width: auto; min-width: 80px; font-size: 1rem; cursor: pointer; }
        .input-group select option { background: #1a1a2e; color: #fff; }

        .event-input {
            width: 300px !important;
            font-size: 1rem !important;
        }

        /* target time display */
        .target-info {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            margin-top: 0.3rem;
        }

        /* progress ring */
        .progress-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .progress-ring { transform: rotate(-90deg); }
        .progress-ring__bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 6; }
        .progress-ring__fill {
            fill: none;
            stroke: url(#gradient);
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }

        /* timer display */
        .timer-display {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .time-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 1.2rem 1.5rem;
            min-width: 110px;
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
        }

        .time-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(167, 139, 250, 0.15);
        }

        .time-card .digits {
            font-size: 4rem;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(180deg, #fff, rgba(255,255,255,0.6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'JetBrains Mono', monospace;
        }

        .time-card .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.3);
            margin-top: 0.5rem;
        }

        .separator {
            font-size: 3.5rem;
            font-weight: 300;
            color: rgba(255,255,255,0.2);
            align-self: center;
            padding-bottom: 1.2rem;
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* current time display */
        .current-time {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.3);
            margin-bottom: 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.1em;
        }

        /* buttons */
        .controls {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .btn {
            padding: 0.7rem 2rem;
            border: none;
            border-radius: 50px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-start {
            background: linear-gradient(135deg, #a78bfa, #6366f1);
            color: #fff;
            box-shadow: 0 4px 20px rgba(167, 139, 250, 0.4);
        }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(167, 139, 250, 0.5); }

        .btn-pause {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: #fff;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
        }
        .btn-pause:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(245, 158, 11, 0.4); }

        .btn-reset {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-reset:hover { background: rgba(255,255,255,0.12); color: #fff; transform: translateY(-2px); }

        .btn:active { transform: translateY(0) !important; }

        /* theme picker */
        .theme-bar {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            padding: 0.8rem;
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .theme-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .theme-btn:hover { transform: scale(1.2); border-color: rgba(255,255,255,0.4); }
        .theme-btn.active { border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.3); transform: scale(1.15); }

        .theme-btn[data-theme="cosmic"]   { background: linear-gradient(135deg, #302b63, #24243e); }
        .theme-btn[data-theme="sunset"]   { background: linear-gradient(135deg, #6b2fa0, #ff6a00); }
        .theme-btn[data-theme="ocean"]    { background: linear-gradient(135deg, #003566, #0db39e); }
        .theme-btn[data-theme="forest"]   { background: linear-gradient(135deg, #1b4332, #40916c); }
        .theme-btn[data-theme="fire"]     { background: linear-gradient(135deg, #b91c1c, #f59e0b); }
        .theme-btn[data-theme="neon"]     { background: linear-gradient(135deg, #0a0a0a, #00ff88); }
        .theme-btn[data-theme="arctic"]   { background: linear-gradient(135deg, #1e3a5f, #a0d2db); }
        .theme-btn[data-theme="midnight"] { background: linear-gradient(135deg, #090979, #00d4ff); }
        .theme-btn[data-theme="cherry"]   { background: linear-gradient(135deg, #4a0028, #c2185b); }
        .theme-btn[data-theme="matrix"]   { background: linear-gradient(135deg, #001a00, #00ff41); }

        .theme-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.3);
            margin-bottom: 0.5rem;
        }

        /* finished */
        .finished .time-card {
            border-color: rgba(52, 211, 153, 0.4);
            animation: pulse-glow 1.5s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(52, 211, 153, 0.1); }
            50% { box-shadow: 0 0 60px rgba(52, 211, 153, 0.3); }
        }

        .finished-text {
            display: none;
            font-size: 1.5rem;
            font-weight: 700;
            color: #34d399;
            margin-bottom: 1rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            animation: fadeIn 0.5s ease;
        }

        .finished .finished-text { display: block; }

        /* urgency - last 60 seconds */
        .urgent .time-card {
            border-color: rgba(239, 68, 68, 0.4);
            animation: urgent-pulse 0.8s ease-in-out infinite;
        }
        .urgent .time-card .digits {
            -webkit-text-fill-color: #ef4444;
            text-shadow: 0 0 20px rgba(239,68,68,0.4);
        }

        @keyframes urgent-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.1); }
            50% { box-shadow: 0 0 50px rgba(239, 68, 68, 0.3); }
        }

        /* warning - last 5 minutes */
        .warning .time-card {
            border-color: rgba(245, 158, 11, 0.3);
        }
        .warning .time-card .digits {
            -webkit-text-fill-color: #f59e0b;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden { display: none !important; }

        /* fullscreen button */
        .btn-fullscreen {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 10;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.6);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .btn-fullscreen:hover { background: rgba(255,255,255,0.15); color: #fff; }

        @media (max-width: 600px) {
            .time-card { min-width: 75px; padding: 0.8rem 1rem; }
            .time-card .digits { font-size: 2.5rem; }
            .separator { font-size: 2rem; }
            .input-group input { width: 65px; font-size: 1.1rem; }
            .event-input { width: 220px !important; }
        }
    </style>
</head>
<body class="theme-cosmic">
    <button class="btn-fullscreen" onclick="toggleFullscreen()" title="Pełny ekran">&#x26F6;</button>

    <div class="bg-particles" id="particles"></div>

    <div class="container">
        <div class="event-name" id="eventName"></div>
        <h1>Hackathon Timer</h1>
        <p class="subtitle" id="subtitleText">Ustaw czas i rozpocznij odliczanie</p>

        <!-- mode tabs -->
        <div class="mode-tabs" id="modeTabs">
            <button class="mode-tab active" data-mode="countdown" onclick="switchMode('countdown')">Odliczanie</button>
            <button class="mode-tab" data-mode="target" onclick="switchMode('target')">Do godziny</button>
        </div>

        <!-- countdown setup -->
        <div class="setup-panel active" id="setupCountdown">
            <div class="setup-row">
                <div class="input-group">
                    <input type="number" id="inputH" min="0" max="99" value="0">
                    <label>Godziny</label>
                </div>
                <div class="input-group">
                    <input type="number" id="inputM" min="0" max="59" value="5">
                    <label>Minuty</label>
                </div>
                <div class="input-group">
                    <input type="number" id="inputS" min="0" max="59" value="0">
                    <label>Sekundy</label>
                </div>
            </div>
            <div class="setup-row">
                <div class="input-group">
                    <input type="text" id="inputEvent" class="event-input" placeholder="Nazwa wydarzenia (opcjonalnie)">
                    <label>Wydarzenie</label>
                </div>
            </div>
        </div>

        <!-- target time setup -->
        <div class="setup-panel" id="setupTarget">
            <div class="setup-row">
                <div class="input-group">
                    <input type="number" id="targetH" min="0" max="23" value="17">
                    <label>Godzina</label>
                </div>
                <div class="input-group">
                    <input type="number" id="targetM" min="0" max="59" value="0">
                    <label>Minuta</label>
                </div>
            </div>
            <div class="setup-row">
                <div class="input-group">
                    <input type="text" id="inputEventTarget" class="event-input" placeholder="np. Koniec hackathonu">
                    <label>Wydarzenie</label>
                </div>
            </div>
            <div class="target-info" id="targetInfo"></div>
            <!-- quick presets -->
            <div class="setup-row" style="margin-top: 0.8rem;">
                <button class="btn btn-reset" style="padding:0.4rem 1rem; font-size:0.7rem" onclick="setPreset(12,0)">12:00</button>
                <button class="btn btn-reset" style="padding:0.4rem 1rem; font-size:0.7rem" onclick="setPreset(14,0)">14:00</button>
                <button class="btn btn-reset" style="padding:0.4rem 1rem; font-size:0.7rem" onclick="setPreset(15,0)">15:00</button>
                <button class="btn btn-reset" style="padding:0.4rem 1rem; font-size:0.7rem" onclick="setPreset(17,0)">17:00</button>
                <button class="btn btn-reset" style="padding:0.4rem 1rem; font-size:0.7rem" onclick="setPreset(18,0)">18:00</button>
                <button class="btn btn-reset" style="padding:0.4rem 1rem; font-size:0.7rem" onclick="setPreset(20,0)">20:00</button>
            </div>
        </div>

        <!-- progress ring -->
        <div class="progress-container">
            <svg class="progress-ring" width="180" height="180">
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#a78bfa"/>
                        <stop offset="50%" stop-color="#60a5fa"/>
                        <stop offset="100%" stop-color="#34d399"/>
                    </linearGradient>
                </defs>
                <circle class="progress-ring__bg" cx="90" cy="90" r="82"/>
                <circle class="progress-ring__fill" id="progressRing" cx="90" cy="90" r="82"
                    stroke-dasharray="515.22" stroke-dashoffset="0"/>
            </svg>
        </div>

        <!-- timer -->
        <div class="timer-display" id="timerDisplay">
            <div class="time-block">
                <div class="time-card">
                    <div class="digits" id="hours">00</div>
                    <div class="label">Godziny</div>
                </div>
            </div>
            <div class="separator">:</div>
            <div class="time-block">
                <div class="time-card">
                    <div class="digits" id="minutes">05</div>
                    <div class="label">Minuty</div>
                </div>
            </div>
            <div class="separator">:</div>
            <div class="time-block">
                <div class="time-card">
                    <div class="digits" id="seconds">00</div>
                    <div class="label">Sekundy</div>
                </div>
            </div>
        </div>

        <div class="current-time" id="currentTime"></div>
        <div class="finished-text" id="finishedText">Czas minął!</div>

        <!-- controls -->
        <div class="controls">
            <button class="btn btn-start" id="btnStart" onclick="startTimer()">Start</button>
            <button class="btn btn-pause hidden" id="btnPause" onclick="pauseTimer()">Pauza</button>
            <button class="btn btn-reset" id="btnReset" onclick="resetTimer()">Reset</button>
        </div>

        <!-- theme picker -->
        <div>
            <div class="theme-label">Motyw</div>
            <div class="theme-bar">
                <div class="theme-btn active" data-theme="cosmic" title="Kosmos" onclick="setTheme('cosmic')"></div>
                <div class="theme-btn" data-theme="sunset" title="Zachód słońca" onclick="setTheme('sunset')"></div>
                <div class="theme-btn" data-theme="ocean" title="Ocean" onclick="setTheme('ocean')"></div>
                <div class="theme-btn" data-theme="forest" title="Las" onclick="setTheme('forest')"></div>
                <div class="theme-btn" data-theme="fire" title="Ogień" onclick="setTheme('fire')"></div>
                <div class="theme-btn" data-theme="neon" title="Neon" onclick="setTheme('neon')"></div>
                <div class="theme-btn" data-theme="arctic" title="Arktyka" onclick="setTheme('arctic')"></div>
                <div class="theme-btn" data-theme="midnight" title="Północ" onclick="setTheme('midnight')"></div>
                <div class="theme-btn" data-theme="cherry" title="Wiśnia" onclick="setTheme('cherry')"></div>
                <div class="theme-btn" data-theme="matrix" title="Matrix" onclick="setTheme('matrix')"></div>
            </div>
        </div>
    </div>

    <script>
        // ===== STATE =====
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let timerInterval = null;
        let isRunning = false;
        let currentMode = 'countdown'; // 'countdown' | 'target'
        let targetTime = null; // Date object for target mode
        const circumference = 2 * Math.PI * 82;

        // DOM refs
        const elHours   = document.getElementById('hours');
        const elMinutes = document.getElementById('minutes');
        const elSeconds = document.getElementById('seconds');
        const elRing    = document.getElementById('progressRing');
        const elDisplay = document.getElementById('timerDisplay');
        const btnStart  = document.getElementById('btnStart');
        const btnPause  = document.getElementById('btnPause');
        const finText   = document.getElementById('finishedText');
        const elEventName = document.getElementById('eventName');
        const elCurrentTime = document.getElementById('currentTime');
        const elTargetInfo = document.getElementById('targetInfo');

        // ===== PARTICLES =====
        (function() {
            const c = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                const size = Math.random() * 6 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 15 + 10) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                c.appendChild(p);
            }
        })();

        // ===== CLOCK =====
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            elCurrentTime.textContent = `Aktualny czas: ${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ===== THEMES =====
        function setTheme(name) {
            document.body.className = 'theme-' + name;
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === name));
            localStorage.setItem('timer-theme', name);
        }

        // restore saved theme
        const saved = localStorage.getItem('timer-theme');
        if (saved) setTheme(saved);

        // ===== MODES =====
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
            document.getElementById('setupCountdown').classList.toggle('active', mode === 'countdown');
            document.getElementById('setupTarget').classList.toggle('active', mode === 'target');
            if (mode === 'target') updateTargetInfo();
            resetTimer();
        }

        function setPreset(h, m) {
            document.getElementById('targetH').value = h;
            document.getElementById('targetM').value = m;
            updateTargetInfo();
        }

        function updateTargetInfo() {
            const h = parseInt(document.getElementById('targetH').value) || 0;
            const m = parseInt(document.getElementById('targetM').value) || 0;
            const now = new Date();
            const target = new Date(now);
            target.setHours(h, m, 0, 0);
            if (target <= now) target.setDate(target.getDate() + 1);

            const diff = Math.floor((target - now) / 1000);
            const dh = Math.floor(diff / 3600);
            const dm = Math.floor((diff % 3600) / 60);
            elTargetInfo.textContent = `Za ${dh}h ${dm}min`;

            // also update display preview
            updateDisplay(diff);
        }

        // update target info every minute
        setInterval(() => {
            if (currentMode === 'target' && !isRunning) updateTargetInfo();
        }, 10000);

        // ===== HELPERS =====
        function pad(n) { return String(n).padStart(2, '0'); }

        function updateDisplay(sec) {
            if (sec < 0) sec = 0;
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            elHours.textContent   = pad(h);
            elMinutes.textContent = pad(m);
            elSeconds.textContent = pad(s);

            // update ring
            const progress = totalSeconds > 0 ? (totalSeconds - sec) / totalSeconds : 0;
            elRing.style.strokeDashoffset = circumference * (1 - progress);

            // urgency classes
            elDisplay.classList.remove('urgent', 'warning');
            if (isRunning && sec > 0) {
                if (sec <= 60) elDisplay.classList.add('urgent');
                else if (sec <= 300) elDisplay.classList.add('warning');
            }

            // update page title
            document.title = `${pad(h)}:${pad(m)}:${pad(s)} - Timer`;
        }

        function getCountdownSeconds() {
            const h = parseInt(document.getElementById('inputH').value) || 0;
            const m = parseInt(document.getElementById('inputM').value) || 0;
            const s = parseInt(document.getElementById('inputS').value) || 0;
            return h * 3600 + m * 60 + s;
        }

        function getTargetSeconds() {
            const h = parseInt(document.getElementById('targetH').value) || 0;
            const m = parseInt(document.getElementById('targetM').value) || 0;
            const now = new Date();
            targetTime = new Date(now);
            targetTime.setHours(h, m, 0, 0);
            if (targetTime <= now) targetTime.setDate(targetTime.getDate() + 1);
            return Math.floor((targetTime - now) / 1000);
        }

        // ===== TIMER CONTROLS =====
        function startTimer() {
            if (isRunning) return;

            if (remainingSeconds <= 0) {
                if (currentMode === 'countdown') {
                    totalSeconds = getCountdownSeconds();
                    remainingSeconds = totalSeconds;
                } else {
                    totalSeconds = getTargetSeconds();
                    remainingSeconds = totalSeconds;
                }
                if (totalSeconds <= 0) return;
            }

            // set event name
            const eventInput = currentMode === 'countdown'
                ? document.getElementById('inputEvent')
                : document.getElementById('inputEventTarget');
            elEventName.textContent = eventInput.value || '';

            isRunning = true;
            document.getElementById('modeTabs').classList.add('hidden');
            document.getElementById('setupCountdown').classList.remove('active');
            document.getElementById('setupTarget').classList.remove('active');
            btnStart.classList.add('hidden');
            btnPause.classList.remove('hidden');
            finText.style.display = 'none';
            elDisplay.classList.remove('finished');
            document.getElementById('subtitleText').textContent =
                currentMode === 'target' ? `Odliczanie do ${pad(parseInt(document.getElementById('targetH').value))}:${pad(parseInt(document.getElementById('targetM').value))}` : 'Odliczanie w toku...';

            if (currentMode === 'target') {
                // for target mode, recalculate from real time each tick
                timerInterval = setInterval(() => {
                    const now = new Date();
                    const diff = Math.floor((targetTime - now) / 1000);
                    remainingSeconds = diff;
                    if (diff <= 0) {
                        remainingSeconds = 0;
                        updateDisplay(0);
                        timerFinished();
                        return;
                    }
                    updateDisplay(diff);
                }, 1000);
            } else {
                timerInterval = setInterval(() => {
                    remainingSeconds--;
                    updateDisplay(remainingSeconds);
                    if (remainingSeconds <= 0) {
                        timerFinished();
                    }
                }, 1000);
            }
            updateDisplay(remainingSeconds);
        }

        function timerFinished() {
            clearInterval(timerInterval);
            isRunning = false;
            btnPause.classList.add('hidden');
            elDisplay.classList.remove('urgent', 'warning');
            elDisplay.classList.add('finished');
            finText.style.display = 'block';
            document.getElementById('subtitleText').textContent = 'Czas dobiegł końca!';
            document.title = 'CZAS MINĄŁ!';
            playAlarm();
        }

        function pauseTimer() {
            if (currentMode === 'target') {
                // pause not meaningful for target mode - just save remaining
                const now = new Date();
                remainingSeconds = Math.floor((targetTime - now) / 1000);
            }
            clearInterval(timerInterval);
            isRunning = false;
            btnPause.classList.add('hidden');
            btnStart.classList.remove('hidden');
            btnStart.textContent = 'Wznów';
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            remainingSeconds = 0;
            totalSeconds = 0;
            targetTime = null;

            if (currentMode === 'countdown') {
                updateDisplay(getCountdownSeconds());
            } else {
                updateTargetInfo();
            }

            elRing.style.strokeDashoffset = 0;
            document.getElementById('modeTabs').classList.remove('hidden');
            document.getElementById('setup' + (currentMode === 'countdown' ? 'Countdown' : 'Target')).classList.add('active');
            btnStart.classList.remove('hidden');
            btnPause.classList.add('hidden');
            btnStart.textContent = 'Start';
            finText.style.display = 'none';
            elDisplay.classList.remove('finished', 'urgent', 'warning');
            elEventName.textContent = '';
            document.getElementById('subtitleText').textContent = 'Ustaw czas i rozpocznij odliczanie';
            document.title = 'Hackathon Timer';
        }

        // ===== ALARM =====
        function playAlarm() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                // longer alarm for hackathon
                const pattern = [880, 1108, 880, 1108, 880, 0, 880, 1108, 880, 1108, 880];
                pattern.forEach((freq, i) => {
                    if (freq === 0) return;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.2);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.2 + 0.18);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + i * 0.2);
                    osc.stop(ctx.currentTime + i * 0.2 + 0.2);
                });
            } catch(e) {}
        }

        // ===== FULLSCREEN =====
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // ===== INIT =====
        updateDisplay(getCountdownSeconds());

        // live preview while typing countdown inputs
        document.querySelectorAll('#setupCountdown input[type="number"]').forEach(input => {
            input.addEventListener('input', () => {
                if (!isRunning && remainingSeconds <= 0 && currentMode === 'countdown') {
                    updateDisplay(getCountdownSeconds());
                }
            });
        });

        // live preview for target inputs
        document.querySelectorAll('#setupTarget input[type="number"]').forEach(input => {
            input.addEventListener('input', () => {
                if (!isRunning && currentMode === 'target') updateTargetInfo();
            });
        });

        // keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') { e.preventDefault(); isRunning ? pauseTimer() : startTimer(); }
            if (e.code === 'KeyR') resetTimer();
            if (e.code === 'KeyF') toggleFullscreen();
        });
    </script>
</body>
</html>
